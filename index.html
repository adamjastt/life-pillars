<style>
:root{color-scheme:dark;--bg:#121016;--card:#1c1a22;--card2:#26232e;--line:#2e2b37;--ink:#f1eff6;--mut:#a9a5b5;--hero:#0d0c11;--acc:#8d88ff;--bad:#ff5a5a}

.hero{background:var(--hero);padding:calc(14px + env(safe-area-inset-top)) max(5vw,16px) 22px}
.in{max-width:980px;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:center;gap:4px 12px;flex-wrap:wrap}

.legend{display:grid;gap:10px}
.lg{display:grid;grid-template-columns:14px 1fr auto;gap:10px;align-items:center}
.lg i{width:14px;height:14px;border-radius:4px}

.wrap{max-width:980px;margin:0 auto;padding:20px max(5vw,16px) 30px}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.card{background:var(--card);border-radius:18px;padding:16px 18px;margin-bottom:16px}

h2{font-size:19px;margin:0}
h3{font-size:15px;margin:16px 0 6px;color:var(--mut);font-weight:600}
.big{font-family:Sora,sans-serif;font-size:30px;color:var(--pc,var(--ink));line-height:1}

.mrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.mrow:first-of-type{border-top:0}

.bar{grid-column:1/-1;height:6px;border-radius:9px;background:var(--card2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pc,var(--acc));border-radius:9px}
.bar.lim{display:flex;position:relative}.bar.lim i{flex:none;border-radius:9px 0 0 9px}.bar.lim:not(.over) i{border-radius:9px}.bar.lim b{display:block;height:100%;background:var(--bad);border-radius:0 9px 9px 0}.bar.lim u{position:absolute;top:-2px;bottom:-2px;width:2px;margin-left:-1px;background:var(--ink,#fff);opacity:.7}

.pick{background:var(--card2);border-radius:14px;padding:14px;margin-top:10px}
.grid3{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 10px}
label.f{display:grid;gap:4px;font-size:13px;color:var(--mut)}
label.f{min-width:0}input[type=date],input[type=time]{-webkit-appearance:none;appearance:none;display:block;width:100%;min-width:0;max-width:100%;box-sizing:border-box;text-align:left}input::-webkit-date-and-time-value{text-align:left;margin:0}input[type=time]:not(:valid)::-webkit-datetime-edit,input[type=time][value='']::-webkit-datetime-edit{color:var(--mut)}
details>summary{cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:48px;padding:0 16px;border:1px solid #ffffff24;border-radius:12px;background:var(--card2);color:var(--ink);font-weight:500}
summary::-webkit-details-marker{display:none}
summary::after{content:'';flex:none;width:8px;height:8px;border-right:2px solid var(--mut);border-bottom:2px solid var(--mut);transform:translateY(-2px) rotate(45deg)}
details[open]>summary{margin-bottom:12px}
details[open]>summary::after{transform:translateY(2px) rotate(-135deg)}
summary:hover{border-color:#ffffff4d}
.btn.sec{border:1px solid #ffffff24}
.btn:active,.stp button:active,.link:active,summary:active,.res:active,.seg button:active,.preset:active,.nav button:active{transform:scale(.97)}
.btn:hover,.stp button:hover{filter:brightness(1.12)}
.linkbtn{background:none;border:0;color:var(--ink);text-decoration:underline;text-underline-offset:3px;min-height:44px;padding:0 4px;font-weight:500}
.res{border-radius:10px}.res:hover{background:var(--card2)}
.link::after{content:'›';margin-left:8px;color:var(--mut);font-size:18px}
.hist{display:grid;grid-template-columns:4.8em repeat(14,minmax(0,1fr));gap:4px;align-items:center}
.hist .l{font-size:13px;color:var(--mut)}.hist .h{font-size:11px;color:var(--mut);text-align:center}
.cell{aspect-ratio:1;border-radius:5px;border:1px dashed var(--line);background:none;padding:0}
.cell.cur{outline:2px solid var(--ink);outline-offset:1px}
table{width:100%;border-collapse:collapse;font-size:15px}
td,th{padding:9px 4px;border-top:1px solid var(--line);text-align:left}th{color:var(--mut);font-weight:500;font-size:13px}
td.n,th.n{text-align:right;white-space:nowrap}th.n{white-space:normal}
@media(max-width:380px){table{font-size:13px}td,th{padding:8px 3px}}
.up{color:#3cc985}.down{color:var(--bad)}
.mset{display:grid;grid-template-columns:2fr 1fr 1fr 1.3fr 1fr 1fr 44px;gap:6px;align-items:end;padding:8px 0;border-top:1px solid var(--line)}

.fhero{position:relative;height:clamp(190px,34vw,280px);overflow:hidden}

function startTour(){tour={i:0};location.hash=fishOnly()?'fishing':'today';setTimeout(showTour,60)}
function endTour(){tour=null;const el=document.getElementById('tour');if(el)el.innerHTML='';try{localStorage.setItem('ptour','1')}catch(e){}}
function showTour(){const el=document.getElementById('tour');if(!tour||!el)return;const S=TOUR(),s=S[tour.i];if(!s){endTour();return}
 if(view()!==s.v){location.hash=s.v;setTimeout(showTour,80);return}
 const tg=s.sel&&document.querySelector(s.sel);if(tg&&!tg.closest('.tabs'))tg.scrollIntoView({block:'center'});
 requestAnimationFrame(()=>{const r=tg?tg.getBoundingClientRect():null,pad=8,last=tour.i===S.length-1,vw=innerWidth,vh=innerHeight;
  const spot=r?`<div class="tspot" style="left:${r.left-pad}px;top:${r.top-pad}px;width:${r.width+pad*2}px;height:${r.height+pad*2}px"></div>`:'<div class="tdim"></div>';
  let pos='left:50%;top:50%;transform:translate(-50%,-50%)';
  if(r){const below=r.bottom+pad+14,cardH=190;pos=below+cardH<vh?`top:${below}px`:`top:${Math.max(12,r.top-pad-14-cardH)}px`;pos+=`;left:${Math.max(12,Math.min(vw-12-Math.min(360,vw-24),r.left+r.width/2-Math.min(360,vw-24)/2))}px`}
  el.innerHTML=`<div class="tour" role="dialog" aria-modal="true" aria-label="App tour">${spot}<div class="tcard" style="${pos}"><p class="tstep">${tour.i+1} of ${S.length}</p><h3>${esc(s.t)}</h3><p>${esc(s.d)}</p><div class="row"><button class="btn" data-tour="next">${last?'Start tracking':'Next'}</button>${tour.i?'<button class="btn sec" data-tour="back">Back</button>':''}${last?'':'<button class="linkbtn" data-tour="skip">Skip tour</button>'}</div></div></div>`;
  const b=el.querySelector('[data-tour=next]');if(b)b.focus()})}
document.getElementById('tour').addEventListener('click',e=>{const b=e.target.closest('[data-tour]');if(!b)return;const a=b.dataset.tour;
 if(a==='next'){tour.i++;if(tour.i>=TOUR().length){endTour();return}showTour()}if(a==='back'){tour.i=Math.max(0,tour.i-1);showTour()}if(a==='skip')endTour()});
addEventListener('resize',()=>{if(tour)showTour()});addEventListener('keydown',e=>{if(tour&&e.key==='Escape')endTour();if(tour&&e.key==='ArrowRight'){tour.i++;tour.i>=TOUR().length?endTour():showTour()}});
applyIcon();
/* New day while the app was open or suspended: reload so Today is today */
function dayCheck(){if(iso(new Date())!==TODAY){try{sessionStorage.removeItem('pcur2')}catch(e){}if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();setTimeout(()=>location.reload(),50)}}
addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')dayCheck()});setInterval(dayCheck,60e3);
snapAll();render();initSync();setTimeout(()=>takeSnap('On open'),1000);setTimeout(checkUpdate,1500);setInterval(()=>{if(document.visibilityState==='visible')checkUpdate()},5*60*1000);
try{const pv=localStorage.getItem('pver');if(pv&&pv!==VERSION)setTimeout(()=>toast('Updated to v'+VERSION),600);localStorage.setItem('pver',VERSION)}catch(e){}
}
