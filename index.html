<style>

.fe{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:6px 0}

.x{border:0;background:none;color:var(--mut);width:44px;height:44px;font-size:20px}
.seg{display:flex;gap:6px;overflow-x:auto;margin:10px 0}
.seg button{flex:none;height:40px;padding:0 14px;border-radius:99px;border:1px solid var(--line);background:none}
.seg button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.res{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:10px 2px;min-height:52px}

.pick{background:var(--card2);border-radius:14px;padding:14px;margin-top:10px}
.grid3{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
label.f{display:grid;gap:4px;font-size:13px;color:var(--mut)}
details summary{cursor:pointer;min-height:44px;display:flex;align-items:center;color:var(--mut)}
.hist{display:grid;grid-template-columns:4.8em repeat(14,minmax(0,1fr));gap:4px;align-items:center}
.hist .l{font-size:13px;color:var(--mut)}.hist .h{font-size:11px;color:var(--mut);text-align:center}
.cell{aspect-ratio:1;border-radius:5px;border:1px dashed var(--line);background:none;padding:0}
.cell.cur{outline:2px solid var(--ink);outline-offset:1px}
table{width:100%;border-collapse:collapse;font-size:15px}
td,th{padding:9px 4px;border-top:1px solid var(--line);text-align:left}th{color:var(--mut);font-weight:500;font-size:13px}
td.n,th.n{text-align:right;white-space:nowrap}
.up{color:#3cc985}.down{color:var(--bad)}
.mset{display:grid;grid-template-columns:2fr 1fr 1fr 1.3fr 1fr 1fr 44px;gap:6px;align-items:end;padding:8px 0;border-top:1px solid var(--line)}
.mset input,.mset select{padding:8px;height:44px}
.ptitle{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr) 56px auto;gap:8px;align-items:end}
input[type=color]{padding:4px;height:44px}
.toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:20;max-width:90vw}
.empty{color:var(--mut);font-size:14px;padding:8px 0}
@media(max-width:700px){.wheelwrap{grid-template-columns:1fr;gap:16px}.wheel{max-width:250px;margin:0 auto}.cards{grid-template-columns:1fr}.kcal{grid-template-columns:1fr}
.mset{grid-template-columns:repeat(3,minmax(0,1fr))}.mset .mname{grid-column:1/-1}.ptitle{grid-template-columns:minmax(0,1fr) 56px}.ptitle .ps{display:none}}
@media(prefers-reduced-motion:no-preference){.bar i{transition:width .3s}}
</style></head><body><div id="root"></div><div id="toast"></div><script>
{

const GENERIC=[['Chicken breast, cooked',165,31,0,3.6],['Turkey breast, cooked',135,30,0,1],['Beef mince 5%, cooked',175,26,0,8],['Salmon, cooked',206,22,0,13],['Tuna, canned in water',116,26,0,1],['Prawns, cooked',99,24,0,0.3],['Egg (1 large ≈ 60 g)',143,12.6,0.7,9.5],['Tofu, firm',144,17,3,9],['White rice, cooked',130,2.7,28,0.3],['Brown rice, cooked',123,2.7,26,1],['Pasta, cooked',158,5.8,31,0.9],['Potato, boiled',87,1.9,20,0.1],['Sweet potato, baked',90,2,21,0.2],['Porridge oats, dry',389,16.9,66,6.9],['Wholemeal bread',247,13,41,3.4],['White bread',265,9,49,3.2],['Banana',89,1.1,23,0.3],['Apple',52,0.3,14,0.2],['Blueberries',57,0.7,14,0.3],['Orange',47,0.9,12,0.1],['Broccoli',34,2.8,7,0.4],['Spinach',23,2.9,3.6,0.4],['Avocado',160,2,9,15],['Greek yoghurt, 0%',59,10,3.6,0.4],['Semi-skimmed milk',46,3.4,4.7,1.7],['Cheddar cheese',403,25,1.3,33],['Cottage cheese',98,11,3.4,4.3],['Whey protein powder',400,80,8,6],['Peanut butter',588,25,20,50],['Almonds',579,21,22,50],['Olive oil',884,0,0,100],['Butter',717,0.9,0.1,81],['Lentils, cooked',116,9,20,0.4],['Chickpeas, canned',139,7,23,2.6],['Honey',304,0.3,82,0],['Dark chocolate 70%',598,7.8,46,43],['Orange juice',45,0.7,10,0.2]].map(a=>({n:a[0],kcal:a[1],p:a[2],c:a[3],f:a[4],unit:'g',def:100,src:'Basic'}));

/* ---------- Storage ---------- */
let D=null;
try{D=JSON.parse(localStorage.getItem('pillars2')||'null')}catch(e){}
if(!D||!D.cfg)D={cfg:PRESET(),days:{},foods:[],recent:[],updated:0};

let cur=TODAY;try{cur=sessionStorage.getItem('pcur')||TODAY}catch(e){}

let meal=(h=>h<11?'Breakfast':h<15?'Lunch':h<21?'Dinner':'Snacks')(new Date().getHours());
const openP=new Set();let results=[],shown=[],picked=null,status='',resetArm=false,lastQ='';

/* ---------- Scoring ---------- */
const P=()=>D.cfg.pillars;
const allM=()=>P().flatMap(p=>p.m);
const mById=id=>allM().find(m=>m.id===id);
const day=d=>(D.days[d]=D.days[d]||{v:{},food:[],note:''});
function val(d,m){const x=D.days[d];if(!x)return null;
 if(m.food){const f=x.food||[];return f.length?f.reduce((a,e)=>a+(+e[m.food]||0),0):null}
 const v=x.v&&x.v[m.id];return v==null?null:v}
function mScore(m,v){if(v==null)return 0;const t=+m.t||1;
 if(m.d==='max')return v<=t?1:Math.max(0,1-(v-t)/t);
 if(m.d==='near'){const r=Math.abs(v-t)/t;return r<=0.1?1:Math.max(0,1-(r-0.1)/0.4)}
 return Math.min(v/t,1)}
function pScore(p,d){let s=0,w=0;for(const m of p.m){const ww=+m.w||1;w+=ww;s+=ww*mScore(m,val(d,m))}return w?Math.round(100*s/w):0}
const overall=d=>P().length?Math.round(P().reduce((a,p)=>a+pScore(p,d),0)/P().length):0;
const logged=d=>{const x=D.days[d];return!!x&&((x.food&&x.food.length)||Object.keys(x.v||{}).length>0)};
function streak(){const g=+D.cfg.good||70;let d=overall(TODAY)>=g?TODAY:shift(TODAY,-1),n=0;while(overall(d)>=g&&n<3650){n++;d=shift(d,-1)}return n}
function label(d){if(d===TODAY)return'Today';if(d===shift(TODAY,-1))return'Yesterday';return new Date(d+'T12:00:00').toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'})}
const goalTxt=m=>(m.d==='max'?'limit ':m.d==='near'?'target ~':'goal ')+fmt(m.t)+' '+esc(m.u);

/* ---------- Views ---------- */
const navBar=()=>`<div class="nav"><button data-nav="-1" aria-label="Previous day">‹</button><span class="d">${label(cur)}</span><button data-nav="1" aria-label="Next day" ${cur>=TODAY?'disabled':''}>›</button>${cur!==TODAY?'<button data-nav="0">Today</button>':''}</div>`;
function wheel(d){const ps=P(),n=ps.length||1,c=150;
 const sec=(i,r)=>{if(n===1)return`M${c-r} ${c}a${r} ${r} 0 1 0 ${2*r} 0a${r} ${r} 0 1 0 ${-2*r} 0`;const a0=(-90+i*360/n)*Math.PI/180,a1=(-90+(i+1)*360/n)*Math.PI/180;
  return`M${c} ${c}L${(c+r*Math.cos(a0)).toFixed(1)} ${(c+r*Math.sin(a0)).toFixed(1)}A${r} ${r} 0 ${360/n>180?1:0} 1 ${(c+r*Math.cos(a1)).toFixed(1)} ${(c+r*Math.sin(a1)).toFixed(1)}Z`};
 return`<svg class="wheel" viewBox="0 0 300 300" role="img" aria-label="Pillar scores">${[.25,.5,.75,1].map(f=>`<circle cx="150" cy="150" r="${(30+110*f).toFixed(0)}" fill="none" stroke="#ffffff1c"/>`).join('')}
 ${ps.map((p,i)=>{const s=pScore(p,d);return`<path d="${sec(i,140)}" fill="${esc(p.c)}" opacity=".13"/><path d="${sec(i,s?30+1.1*s:0.1)}" fill="${esc(p.c)}"/>`}).join('')}
 ${n>1?ps.map((p,i)=>{const a=(-90+i*360/n)*Math.PI/180;return`<line x1="150" y1="150" x2="${(150+142*Math.cos(a)).toFixed(1)}" y2="${(150+142*Math.sin(a)).toFixed(1)}" stroke="#0d0c11" stroke-width="4"/>`}).join(''):''}
 <circle cx="150" cy="150" r="38" fill="#0d0c11"/><text x="150" y="157" text-anchor="middle" fill="#fff" font-family="Sora,sans-serif" font-size="22" font-weight="700">${overall(d)}%</text></svg>`}
function mrow(m){const v=val(cur,m),s=mScore(m,v),over=m.d==='max'&&v!=null&&v>m.t;
 const right=m.food?`<a class="link" href="#food">${v==null?'Log food':fmt(v)+' '+esc(m.u)}</a>`:
 `<div class="stp"><button data-dec="${m.id}" aria-label="Less ${esc(m.n)}">−</button><input inputmode="decimal" data-val="${m.id}" value="${v==null?'':v}" placeholder="0" aria-label="${esc(m.n)} (${esc(m.u)})"><button data-inc="${m.id}" aria-label="More ${esc(m.n)}">+</button></div>`;
 return`<div class="mrow"><div><div class="mn">${esc(m.n)}</div><div class="mt">${goalTxt(m)}</div></div>${right}<div class="bar${over?' over':''}"><i style="width:${Math.round(s*100)}%"></i></div></div>`}
function today(){const st=streak();
 return`<header class="hero"><div class="in"><div class="top"><h1>Life Pillars</h1><span class="sub">${st?st+'-day streak':'No streak yet'} · <span data-syncst>${SYNC[syncState]}</span></span></div>${navBar()}
 <div class="wheelwrap">${wheel(cur)}<div><div class="legend">${P().map(p=>`<div class="lg"><i style="background:${esc(p.c)}"></i><span>${esc(p.n)}</span><b>${pScore(p,cur)}%</b></div>`).join('')}</div>

function food(){const x=D.days[cur]||{food:[]},F=x.food||[];

 const km=allM().find(m=>m.food==='kcal'),pm=allM().find(m=>m.food==='p');

 return`<header class="hero"><div class="in"><div class="top"><h1>Food</h1><span class="sub">${F.length} item${F.length===1?'':'s'} logged</span></div>${navBar()}</div></header>
 <main class="wrap"><section class="card"><div class="kcal"><div><div class="kbig">${fmt(Math.round(k))}</div><div class="sub">of ${fmt(kt)} kcal · ${left>=0?fmt(Math.round(left))+' left':fmt(Math.round(-left))+' over'}</div></div>

function acct(){const head='<section class="card"><h2>Account &amp; sync</h2>';
 if(!SB_URL)return head+'<p class="sub">Cloud sync is not set up yet.</p></section>';
 if(!sb)return head+'<p class="sub">Connecting… if this stays, check your internet connection.</p></section>';
 if(user)return head+`<p style="margin:8px 0 2px">Signed in as <b>${esc(user.email)}</b></p><p class="sub"><span data-syncst>${SYNC[syncState]}</span>${lastSync?' · last synced '+lastSync.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}):''}</p><div class="row"><button class="btn" data-act="syncnow">Sync now</button><button class="btn sec" data-act="signout">Sign out</button></div></section>`;
 return head+`<p class="sub">Sign in to back up your data and use the same data on your phone and laptop. Anything already on this device is kept and uploaded.</p><form id="auth" class="grid3" style="margin-top:10px"><label class="f" style="grid-column:1/-1">Email<input name="email" type="email" autocomplete="email" required></label><label class="f" style="grid-column:1/-1">Password<input name="pw" type="password" autocomplete="current-password" minlength="6" required></label><button class="btn" data-mode="in">Sign in</button><button class="btn sec" data-mode="up">Create account</button></form><p class="sub" id="authmsg" role="status">${esc(authMsg)}</p></section>`}
async function doAuth(f,mode){const email=f.elements.email.value.trim(),pw=f.elements.pw.value,m=document.getElementById('authmsg');
 if(!sb){m.textContent='Still connecting — try again in a moment.';return}m.textContent='Working…';
 try{if(mode==='up'){const r=await sb.auth.signUp({email,password:pw,options:{emailRedirectTo:location.origin+location.pathname}});if(r.error)throw r.error;
   authMsg=r.data.session?'':'Account created. Check your email for a confirmation link, then sign in here.';m.textContent=authMsg}
  else{const r=await sb.auth.signInWithPassword({email,password:pw});if(r.error)throw r.error;authMsg=''}}
 catch(e){const t=(e&&e.message)||'';m.textContent=/fetch|network/i.test(t)?'Can\'t reach the server — check your connection and try again.':/invalid login/i.test(t)?'Wrong email or password.':/not confirmed/i.test(t)?'Confirm your email first — check your inbox for the link.':t||'Something went wrong.'}}
snapAll();render();initSync();
}
</script></body></html>
